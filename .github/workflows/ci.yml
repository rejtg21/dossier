name: CI

# Runs on every pull request, and on pushes to the long-lived branches so the
# default branch always has a status of its own.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @vercel/queue requires Node 22 or newer.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Not covered by eslint: type errors fail the Vercel build, so catch them
      # here rather than at deploy time.
      - name: Typecheck
        run: npx tsc --noEmit

      - run: npm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Separate job so it runs alongside the checks above rather than after them.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cached on the installed Playwright version: browsers are ~150MB and do
      # not change between runs unless the package does.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Only chromium: playwright.config.ts defines no other project.
      - name: Install browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # System deps are not part of the cached browser directory.
      - name: Install browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The config's webServer builds and serves out/ itself, so there is
      # nothing to start here.
      - run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
